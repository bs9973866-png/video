name: Render detailed animated film
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install neural Russian male voice
        run: pip install piper-tts
      - name: Generate deep male narration
        run: python scripts/generate_voice.py
      - name: Install dependencies
        run: npm install
      - name: Ensure browser
        run: npx remotion browser ensure
      - name: Render full eight-minute animated film
        run: npm run render
      - name: Verify output
        run: ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json out/last-message.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: last-message-detailed-film
          path: out/last-message.mp4
          retention-days: 7
name: Render animated stickman film
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install neural Russian voice
        run: pip install piper-tts
      - name: Generate narration
        run: python scripts/generate_voice.py
      - name: Install dependencies
        run: npm install
      - name: Ensure browser
        run: npx remotion browser ensure
      - name: Render MP4
        run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: last-message-animated-film
          path: out/last-message.mp4
          retention-days: 7